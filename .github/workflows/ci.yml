name: CI

# Every check in AGENTS.md, on each pull request and on main. A ruleset on main
# can require the two jobs by name: "studio" and "workers".
on:
  pull_request:
  push:
    branches: [main, claude/pensive-goodall-typ3ij]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the director package
        run: pnpm --filter @kinora/director build
      - name: Generated files match their sources
        run: |
          pnpm guide:emit
          pnpm db:emit
          pnpm pod:bundle
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files differ from their sources. Run the emitters in AGENTS.md and commit what they write."
            git status --porcelain
            git diff --stat
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @kinora/director test
      - name: Build as the deploy does
        run: pnpm build

  workers:
    name: workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/*/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install pytest -r workers/h3-runpod/requirements.txt -r workers/assembler/requirements.txt
      - run: python -m pytest workers
